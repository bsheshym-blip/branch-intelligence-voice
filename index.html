<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch Intelligence Voice v4</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:18px;color:#17212b}.box{max-width:700px;margin:auto;background:white;padding:20px;border-radius:18px;box-shadow:0 4px 20px #0001}button,select,input{font-size:17px;padding:12px;margin:6px;border-radius:10px;border:1px solid #ccd}.talk{width:100%;font-size:22px}.status{padding:12px;background:#f0f2f4;border-radius:10px;margin:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}</style></head><body><div class="box"><h1>🎙️ Branch Intelligence</h1><p>الإصدار v4 — صوت عربي من الخادم، وليس من أصوات الهاتف.</p><button class="talk" id="talk">🎙️ تحدث معي</button><div class="status" id="status">جاهز</div><h3>🎛️ صوت الوكيل</h3><div class="row"><label>الصوت:</label><select id="voice"><option value="marin">Marin — مهني</option><option value="cedar">Cedar — هادئ</option><option value="coral">Coral — ودود</option><option value="alloy">Alloy</option><option value="ash">Ash</option><option value="sage">Sage</option></select></div><div class="row"><label>السرعة</label><input id="speed" type="range" min="0.7" max="1.2" step="0.05" value="1"><span id="sv">1.00</span></div><button id="test">🔊 تجربة الصوت</button><div id="reply"></div></div><script>
const $=id=>document.getElementById(id); $('speed').oninput=()=> $('sv').textContent=Number($('speed').value).toFixed(2);
async function speak(text){$('status').textContent='🔊 جارٍ توليد الصوت العربي...'; const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:$('voice').value,speed:Number($('speed').value)})}); if(!r.ok){let j=await r.json().catch(()=>({})); throw Error(j.error||'فشل الصوت');} const blob=await r.blob(); const url=URL.createObjectURL(blob); const a=new Audio(url); await a.play(); a.onended=()=>URL.revokeObjectURL(url); $('status').textContent='جاهز';}
$('test').onclick=()=>speak('مرحباً، أنا وكيل ذكاء اصطناعي لإدارة وتحليل أداء الفروع. هذا صوت عربي مولد من الخادم وليس صوت الهاتف.').catch(e=>$('status').textContent='❌ '+e.message);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec;if(SR){rec=new SR();rec.lang='ar-LY';rec.interimResults=false;rec.onstart=()=> $('status').textContent='🎙️ أسمعك الآن...';rec.onerror=e=>$('status').textContent='❌ '+e.error;rec.onresult=async e=>{const text=e.results[0][0].transcript;$('reply').textContent='أنت: '+text;let answer='فهمت طلبك: '+text+'. سأحلله ضمن بيانات الفروع عند ربط محرك التحليل.';$('reply').textContent+='\n\nالوكيل: '+answer;try{await speak(answer)}catch(err){$('status').textContent='❌ '+err.message}};rec.onend=()=>{if($('status').textContent.includes('أسمعك'))$('status').textContent='جاهز';};$('talk').onclick=()=>rec.start();}else $('talk').disabled=true;
</script></body></html>
